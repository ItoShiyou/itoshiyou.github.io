<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:2500px;height:843px;overflow:hidden}
body{display:grid;grid-template-columns:1fr 1fr 1fr;background:#f6f5fb;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#141638}
.c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;border-right:6px solid #e3e0f0}
.c:last-child{border-right:0}
.c.main{background:linear-gradient(135deg,#1b1d4a 0%,#2d2a78 55%,#6a3fd8 100%);color:#fff}
.ico{display:flex;gap:18px}
.ico img{width:150px;height:150px;border-radius:34px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.big{font-size:104px;font-weight:800;letter-spacing:4px}
.sub{font-size:52px;font-weight:600;opacity:.72}
.logo{width:330px;height:330px;object-fit:cover;border-radius:40px}
.bar{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,#e576d6,#7a4dff)}
</style></head><body>
<div class="c main"><div class="ico"><img src="handangaku.png"><img src="tsumiage_demae.png"><img src="omoide_hyakkaten.png"></div><div class="big">アプリ一覧</div><div class="sub">THE Bonjin の作品</div><div class="bar"></div></div>
<div class="c"><div class="ico"><img src="handangaku.png" style="width:230px;height:230px;border-radius:52px"></div><div class="big">新作をあそぶ</div><div class="sub">いちばん新しいアプリ</div></div>
<div class="c"><img class="logo" src="thebonjin_logo.png"><div class="sub" style="font-size:64px;opacity:.85;font-weight:700">Webサイト</div></div>
</body></html>
